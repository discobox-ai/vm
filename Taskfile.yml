version: "3"

vars:
  # Windows resolves an extensionless name through PATHEXT, so a build without
  # the suffix lands beside a stale .exe the shell keeps running.
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  BINARY: build/disco-vm{{.EXE}}
  MAIN: ./cmd/disco-vm
  # On macOS the binary must carry the virtualization entitlement before it can
  # create a VM, and a rebuild drops the signature, so build re-signs it.
  ENTITLEMENTS: cmd/disco-vm/disco-vm.entitlements
  PACKAGES: ./...
  LINT_BIN: golangci-lint{{.EXE}}
  # The race detector needs cgo, which the Windows runner does not provide.
  RACE: '{{if ne OS "windows"}}-race{{end}}'
  # vz is cgo, so darwin lints only on a Mac: cross-linting it elsewhere sees
  # the no-cgo stub. CI's macos job covers it.
  LINT_OSES: '{{if eq OS "darwin"}}darwin {{end}}linux windows'
  # disco-vm is also the guest agent, which install copies into a guest that
  # has its own libc or none, so it is built static. vz is cgo, so not on macOS.
  CGO: '{{if eq OS "darwin"}}1{{else}}0{{end}}'
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -X github.com/discobox-ai/vm/internal/version.Version={{.VERSION}}
  # Every Debian this repository builds on is sid at one snapshot, and this is
  # the only place it is named (the root DESIGN.md, Debian): the newest dated
  # sid-slim image, by digest, to start from, and the snapshot.debian.org
  # timestamp every stage's apt reads and full-upgrades to. A bump moves both
  # (the snapshot no older than the image's own, in its debian.sources).
  DEBIAN_IMAGE: public.ecr.aws/docker/library/debian:sid-20261104-slim@sha256:07a3205e8583fdff12d2b05bd030f50437e9fd340ee616df0c05dc77af75767b
  DEBIAN_SNAPSHOT: 20261112T202949Z
  DEBIAN_ARGS: --build-arg DEBIAN_IMAGE={{.DEBIAN_IMAGE}} --build-arg DEBIAN_SNAPSHOT={{.DEBIAN_SNAPSHOT}}

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Compile disco-vm into build/, static off macOS, signed on macOS
    env:
      CGO_ENABLED: "{{.CGO}}"
    cmds:
      - mkdir -p build
      - go build -ldflags '{{.LDFLAGS}}' -o {{.BINARY}} {{.MAIN}}
      - cmd: codesign --force --sign - --entitlements {{.ENTITLEMENTS}} {{.BINARY}}
        platforms: [darwin]
      # A Linux guest on vz boots with the linux agent beside it
      # ($DISCO_VM_AGENT), which a darwin binary cannot be.
      - task: build:linux-agent
        vars:
          AGENT_ARCH: "{{ARCH}}"
        platforms: [darwin]

  # A plain `go install` links the host's libc where cgo is on, and a guest
  # without that libc cannot run the result as its agent.
  install:
    desc: Install disco-vm into GOBIN, static off macOS
    env:
      CGO_ENABLED: "{{.CGO}}"
    cmds:
      - go install -ldflags '{{.LDFLAGS}}' {{.MAIN}}

  build:linux-agent:
    desc: Cross-compile a static linux disco-vm into build/linux-AGENT_ARCH/ (amd64 unless AGENT_ARCH says), the agent $DISCO_VM_AGENT names for a docker guest from another host, or a vz Linux guest
    vars:
      AGENT_ARCH: '{{.AGENT_ARCH | default "amd64"}}'
    cmds:
      - mkdir -p build/linux-{{.AGENT_ARCH}}
      - CGO_ENABLED=0 GOOS=linux GOARCH={{.AGENT_ARCH}} go build -ldflags '{{.LDFLAGS}}' -o build/linux-{{.AGENT_ARCH}}/disco-vm {{.MAIN}}

  # disco-vm's Linux guest image (pkg/guest/linux, ADR 26-10-31-990), for one
  # architecture: assembled and verified inside the build, so a broken one
  # fails here and not as a blank console. Boot the result on vz by naming the
  # directory as the base: `disco-vm run $PWD/build/linux-guest/arm64`.
  build:linux-guest:
    desc: Build the Linux guest image's artifacts for linux/GUEST_ARCH (this host's unless set) into build/linux-guest/GUEST_ARCH
    vars:
      GUEST_ARCH: '{{.GUEST_ARCH | default ARCH}}'
    cmds:
      - docker buildx build --platform linux/{{.GUEST_ARCH}} {{.DEBIAN_ARGS}} --output type=local,dest=build/linux-guest/{{.GUEST_ARCH}} pkg/guest/linux

  # The Linux guest image's release, on its own line: a linux/vN tag pushes
  # ghcr.io/discobox-ai/disco-vm-linux:vN for both architectures and prints
  # the digest to pin as linuximage.DefaultBase. arm64 builds under QEMU.
  release:linux-guest:
    desc: Push the Linux guest image for linux/arm64 and linux/amd64 as ghcr.io/discobox-ai/disco-vm-linux:TAG (CI, on a linux/v* tag; needs GITHUB_TOKEN and GITHUB_ACTOR)
    requires:
      vars: [TAG]
    vars:
      IMAGE: ghcr.io/discobox-ai/disco-vm-linux:{{trimPrefix "linux/" .TAG}}
    cmds:
      - docker run --privileged --rm docker.io/tonistiigi/binfmt@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6 --install arm64
      - docker buildx create --use --name disco-vm-linux 2>/dev/null || docker buildx use disco-vm-linux
      - printenv GITHUB_TOKEN | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - mkdir -p build/linux-guest
      - docker buildx build --platform linux/arm64,linux/amd64 {{.DEBIAN_ARGS}} --tag {{.IMAGE}} --push --metadata-file build/linux-guest/metadata.json pkg/guest/linux
      - 'echo "pin linuximage.DefaultBase to {{.IMAGE}}@$(sed -n ''s/.*"containerimage.digest": *"\([^"]*\)".*/\1/p'' build/linux-guest/metadata.json)"'

  # disco-vm's libkrun runtime (pkg/machine/libkrun/runtime, ADR
  # 26-11-03-530 §3): libkrun, passt, and the launcher, with the libc they
  # load, verified in its build by running the launcher through its own loader
  # in an empty filesystem. Name it to the driver with
  # DISCO_VM_KRUN_RUNTIME=$PWD/build/krun-runtime.
  # RUNTIME_VERSION (a krun/vN tag, in a release) is what runtime.json says,
  # dev by default; a release builds with the same one, so it pushes the
  # build this boots from the cache.
  build:krun-runtime:
    desc: Build the libkrun runtime for linux/amd64 into build/krun-runtime
    vars:
      VERSION: '{{trimPrefix "krun/" (.RUNTIME_VERSION | default "dev")}}'
    cmds:
      - docker buildx build --platform linux/amd64 {{.DEBIAN_ARGS}} --build-arg RUNTIME_VERSION={{.VERSION}} --output type=local,dest=build/krun-runtime pkg/machine/libkrun/runtime

  # The libkrun runtime's release, on its own line: a krun/vN tag pushes
  # ghcr.io/discobox-ai/disco-vm-krun:vN and prints the digest to pin as
  # libkrun.DefaultRuntime. Run after test:libkrun with RUNTIME_VERSION set
  # to the tag, it pushes the build that booted, from the cache.
  release:krun-runtime:
    desc: Push the libkrun runtime for linux/amd64 as ghcr.io/discobox-ai/disco-vm-krun:TAG (CI, on a krun/v* tag; needs GITHUB_TOKEN and GITHUB_ACTOR)
    requires:
      vars: [TAG]
    vars:
      VERSION: '{{trimPrefix "krun/" .TAG}}'
      IMAGE: ghcr.io/discobox-ai/disco-vm-krun:{{trimPrefix "krun/" .TAG}}
    cmds:
      - printenv GITHUB_TOKEN | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - mkdir -p build/krun-runtime
      - docker buildx build --platform linux/amd64 {{.DEBIAN_ARGS}} --build-arg RUNTIME_VERSION={{.VERSION}} --tag {{.IMAGE}} --push --metadata-file build/krun-runtime.metadata.json pkg/machine/libkrun/runtime
      - 'echo "pin libkrun.DefaultRuntime to {{.IMAGE}}@$(sed -n ''s/.*"containerimage.digest": *"\([^"]*\)".*/\1/p'' build/krun-runtime.metadata.json)"'

  # disco-vm's linux agent, published per module version (discobox ADR
  # 26-11-11-963 §10): the static linux disco-vm for amd64 and arm64, built
  # from SRC with the module version as its version, one scratch image per
  # platform (pkg/guest/agentimage) under one index tagged with that version,
  # which an embedder pins by digest and pulls with linuximage.PullAgent. The
  # images only copy, so arm64 needs no emulation; the builder is on the
  # host's network, so a registry on localhost takes a push.
  push:linux-agent:
    desc: Push the linux agent of MODULE_VERSION, built from SRC (this checkout unless set), as REPOSITORY:MODULE_VERSION (ghcr.io/discobox-ai/disco-vm-agent unless set), then check it by its digest
    requires:
      vars: [MODULE_VERSION]
    vars:
      SRC: '{{.SRC | default "."}}'
      REPOSITORY: '{{.REPOSITORY | default "ghcr.io/discobox-ai/disco-vm-agent"}}'
    cmds:
      - for: [amd64, arm64]
        cmd: CGO_ENABLED=0 GOOS=linux GOARCH={{.ITEM}} go -C {{.SRC}} build -ldflags '-X github.com/discobox-ai/vm/internal/version.Version={{.MODULE_VERSION}}' -o {{.ROOT_DIR}}/build/linux-agent-image/linux-{{.ITEM}}/disco-vm {{.MAIN}}
      - docker buildx inspect disco-vm-agent >/dev/null 2>&1 || docker buildx create --name disco-vm-agent --driver docker-container --driver-opt network=host
      - docker buildx build --builder disco-vm-agent --platform linux/amd64,linux/arm64 --file pkg/guest/agentimage/Dockerfile --tag {{.REPOSITORY}}:{{.MODULE_VERSION}} --push --metadata-file build/linux-agent-image.metadata.json build/linux-agent-image
      - |
        digest=$(sed -n 's/.*"containerimage.digest": *"\([^"]*\)".*/\1/p' build/linux-agent-image.metadata.json)
        go tool task check:linux-agent IMAGE={{.REPOSITORY}}@$digest MODULE_VERSION={{.MODULE_VERSION}}

  # With no registry credentials, as an embedder pulls it: a package only the
  # release can read fails here.
  check:linux-agent:
    desc: Pull the linux agent IMAGE names by digest, anonymously, for amd64 and arm64, and run this host's to check it is MODULE_VERSION (TestPullPublishedAgent)
    requires:
      vars: [IMAGE, MODULE_VERSION]
    cmds:
      - |
        config=$(mktemp -d)
        trap 'rm -rf "$config"' EXIT
        DOCKER_CONFIG=$config DISCO_VM_AGENT_IMAGE={{.IMAGE}} DISCO_VM_AGENT_VERSION={{.MODULE_VERSION}} go test -count=1 -run '^TestPullPublishedAgent$' -v ./pkg/machine/linuximage
        echo "the linux agent of {{.MODULE_VERSION}} is {{.IMAGE}}"

  test:linux-agent:
    desc: Push the linux agent of this checkout to a registry on localhost and check it by its digest, as a release does (Docker)
    vars:
      PORT: '{{.PORT | default "5055"}}'
    cmds:
      - docker run -d --rm --name disco-vm-agent-registry -p 127.0.0.1:{{.PORT}}:5000 docker.io/library/registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
      - defer: docker rm -f disco-vm-agent-registry
      - task: push:linux-agent
        vars:
          REPOSITORY: localhost:{{.PORT}}/disco-vm-agent
          MODULE_VERSION: '{{.VERSION}}'

  release:linux-agent:
    desc: Publish the linux agent of every commit since BEFORE (or of HEAD) to ghcr.io/discobox-ai/disco-vm-agent, each as its module version (CI, on a push to main or a v* tag; needs GITHUB_TOKEN and GITHUB_ACTOR)
    cmds:
      - printenv GITHUB_TOKEN | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - scripts/release-linux-agent.sh "{{.BEFORE}}"

  # A GitHub-hosted Linux runner has /dev/kvm, but only root may open it, and
  # restricts user namespaces.
  ci:kvm:
    desc: Let every user open /dev/kvm and make user namespaces (CI, on a GitHub-hosted Linux runner; needs sudo)
    platforms: [linux]
    cmds:
      - echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
      - sudo udevadm control --reload-rules
      - sudo udevadm trigger --name-match=kvm
      # Ubuntu 24.04 keeps unprivileged users out of user namespaces, which
      # passt sandboxes itself in.
      - sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

  # The libkrun driver on this Linux amd64 host with KVM: machinetest and
  # internal/e2e, on the runtime and the guest image built from the checkout
  # unless DISCO_VM_KRUN_RUNTIME and DISCO_VM_LIBKRUN_BASE name others
  # (DISCO_VM_LIBKRUN_BASE=default is the pinned guest image). Each shim, and
  # every guest's agent, is the static build.
  test:libkrun:
    desc: Run the libkrun conformance suite and internal/e2e on this Linux amd64 host (needs /dev/kvm)
    platforms: [linux/amd64]
    deps:
      - build
      - build:krun-runtime
      - task: build:linux-guest
        vars:
          GUEST_ARCH: amd64
    env:
      DISCO_VM_TEST_BINARY: '{{.ROOT_DIR}}/{{.BINARY}}'
      DISCO_VM_KRUN_RUNTIME:
        sh: echo "${DISCO_VM_KRUN_RUNTIME:-{{.ROOT_DIR}}/build/krun-runtime}"
      DISCO_VM_LIBKRUN_BASE:
        sh: echo "${DISCO_VM_LIBKRUN_BASE:-{{.ROOT_DIR}}/build/linux-guest/amd64}"
    cmds:
      - go test -count=1 -timeout 30m -v ./pkg/machine/libkrun
      - DISCO_VM_DRIVER=libkrun go test -count=1 -timeout 30m -v ./internal/e2e

  # boxd itself, from any host: machinetest (TestConformance, in pool
  # conformance; DISCO_VM_BOXD_FROM names a committed VM there to start from)
  # and internal/e2e (in pool e2e, or DISCO_VM_E2E_POOL's), each from a fresh
  # VM of boxd's default image (DISCO_VM_E2E_IMAGE names another for e2e).
  # Both make billable machines, and remove them.
  test:boxd:
    desc: Run the boxd conformance suite and internal/e2e against boxd itself (needs BOXD_API_KEY or BOXD_TOKEN)
    deps:
      - build
    preconditions:
      - sh: '[ -n "${BOXD_API_KEY}${BOXD_TOKEN}" ]'
        msg: set BOXD_API_KEY (or BOXD_TOKEN) to a key of the boxd account to run VMs in
    env:
      DISCO_VM_TEST_BINARY: '{{.ROOT_DIR}}/{{.BINARY}}'
    cmds:
      - go test -count=1 -timeout 60m -v -run '^TestConformance$' ./pkg/machine/boxd
      - DISCO_VM_DRIVER=boxd go test -count=1 -timeout 90m -v ./internal/e2e

  # disco-vm has nothing long-running to serve, so the loop only rebuilds.
  dev:
    desc: Rebuild build/disco-vm whenever its source changes
    cmds:
      - go tool watchnbuild -config .wnb.yaml

  run:
    desc: Build and run disco-vm (pass flags after --)
    deps:
      - build
    cmds:
      - ./{{.BINARY}} {{.CLI_ARGS}}

  # internal/e2e runs a second time on a fake driver that does not commit
  # (ADR 26-11-03-868), so the suite's no-commit paths run on every OS. Only
  # the binary it runs reads the variable, which go test's cache does not
  # see, hence -count=1.
  test:
    desc: Run tests with the race detector
    cmds:
      - go test {{.RACE}} {{.PACKAGES}}
      - DISCO_VM_FAKE_NO_COMMIT=1 go test -count=1 {{.RACE}} ./internal/e2e

  # The vz conformance suite on real hardware. DISCO_VM_VZ_BASE names a
  # committed macOS VM (an install), and DISCO_VM_VZ_LINUX_BASE the base fresh
  # Linux VMs start from (default, a guest image's reference, or a directory
  # of its artifacts; see docs/drivers/vz.md); a suite with neither skips. Each started instance's
  # shim is the signed build, and a Linux guest's agent the linux one beside
  # it. caffeinate -d keeps the display awake for the hours a run takes.
  test:vz:
    desc: Run the vz conformance suites on this Mac (needs DISCO_VM_VZ_BASE, DISCO_VM_VZ_LINUX_BASE, or both)
    platforms: [darwin]
    deps:
      - build
    env:
      DISCO_VM_TEST_BINARY: '{{.ROOT_DIR}}/{{.BINARY}}'
      DISCO_VM_AGENT:
        sh: echo "${DISCO_VM_AGENT:-{{.ROOT_DIR}}/build/linux-{{ARCH}}/disco-vm}"
    cmds:
      - caffeinate -d go test -exec {{.ROOT_DIR}}/scripts/codesign-exec -timeout 4h -v -run 'TestConformance|TestLinuxBesideMacOS|TestNoRouteOffTheMachine|TestMacOSAgentFromTheDrive' ./pkg/machine/vz

  # internal/e2e against vz: the signed binary, and a state root that keeps its
  # base install between runs (the first run installs macOS).
  test:e2e:vz:
    desc: Run internal/e2e against vz on this Mac
    platforms: [darwin]
    deps:
      - build
    env:
      DISCO_VM_DRIVER: vz
      DISCO_VM_TEST_BINARY: '{{.ROOT_DIR}}/{{.BINARY}}'
      DISCO_VM_E2E_ROOT:
        sh: echo "${DISCO_VM_E2E_ROOT:-$HOME/Library/Application Support/disco-vm-e2e}"
    cmds:
      - caffeinate -d go test -timeout 4h -v ./internal/e2e

  build:lint-tool:
    desc: Build the golangci-lint binary checks use
    # Built to a known path rather than run through `go tool`, so a fresh
    # checkout does not depend on build-cache state.
    run: once
    cmds:
      - mkdir -p build/tools
      - go build -o build/tools/{{.LINT_BIN}} github.com/golangci/golangci-lint/v2/cmd/golangci-lint

  check:
    desc: Run static checks
    cmds:
      - task: check:vet
      - task: check:go
      - task: check:repo
      - task: check:shell
      - task: check:actions

  check:vet:
    desc: Run go vet for every OS disco-vm ships on
    cmds:
      - for: [linux, darwin, windows]
        cmd: GOOS={{.ITEM}} go vet {{.PACKAGES}}

  check:go:
    desc: Run golangci-lint for linux, windows, and darwin on a Mac
    deps:
      - build:lint-tool
    cmds:
      - for: { var: LINT_OSES, split: ' ' }
        cmd: GOOS={{.ITEM}} ./build/tools/{{.LINT_BIN}} run

  check:repo:
    desc: Check the repository against the discobox-ai standard
    cmds:
      - go tool repocheck

  check:shell:
    desc: Run shellcheck on every tracked shell script
    cmds:
      - git ls-files -z '*.sh' | xargs -0 -r shellcheck

  check:actions:
    desc: Run actionlint on the workflows
    cmds:
      - actionlint

  check:fix:
    desc: Run static checks and apply safe fixes
    deps:
      - build:lint-tool
    cmds:
      - for: { var: LINT_OSES, split: ' ' }
        cmd: GOOS={{.ITEM}} ./build/tools/{{.LINT_BIN}} run --fix

  fmt:
    desc: Format every tracked Go source
    cmds:
      - git ls-files -z '*.go' | xargs -0 -r gofmt -w

  tidy:
    desc: Tidy go.mod/go.sum
    cmds:
      - go mod tidy

  generate:
    desc: Regenerate generated files
    cmds:
      - go generate {{.PACKAGES}}

  sync:
    desc: Rewrite repostd-managed files and the ADR index
    cmds:
      - go tool repocheck sync

  verify:unchanged:
    desc: Run VERIFY_TASK and fail if it changed anything tracked
    internal: true
    cmds:
      # Compared against a snapshot rather than a clean tree: a developer's
      # tree is usually dirty for unrelated reasons.
      - |
        set -eu
        before="$(git status --porcelain; git --no-pager diff)"
        go tool task {{.VERIFY_TASK}}
        after="$(git status --porcelain; git --no-pager diff)"
        if [ "$before" != "$after" ]; then
          echo "'go tool task {{.VERIFY_TASK}}' changed the tree; run it and commit the result." >&2
          git status --porcelain >&2
          exit 1
        fi

  verify:
    desc: Fail when formatting, go.mod, generated, or managed files are stale
    cmds:
      - task: verify:unchanged
        vars: { VERIFY_TASK: fmt }
      - task: verify:unchanged
        vars: { VERIFY_TASK: tidy }
      - task: verify:unchanged
        vars: { VERIFY_TASK: generate }
      - task: verify:unchanged
        vars: { VERIFY_TASK: sync }

  ci:
    desc: Everything CI runs
    cmds:
      - task: verify
      - task: check
      - task: test

  clean:
    desc: Remove build output
    cmds:
      - rm -rf build
