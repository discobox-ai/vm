# Enabled, not masked: it is the only thing that gives network-online.target a
# meaning under networkd, so a unit ordered after that target waits for the
# lease. --any waits for the one NIC; --timeout bounds a NIC that never gets
# one.
#
# A guest Boot attached no network device (an instance fenced to nothing, ADR
# 26-10-31-990) is told so on its command line, and skips the wait instead of
# failing it 30 seconds into every boot. The condition reads what Boot
# decided, not whether a device exists yet: udev may load virtio_net after
# this unit is considered, and a guest with a NIC must still wait for it.
[Unit]
ConditionKernelCommandLine=!disco-vm.nic=0

[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=30
