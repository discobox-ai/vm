# The Windows OS image: a retail ISO, installed unattended, with the disco-vm
# agent baked in by the hcs driver as a boot-start SYSTEM service.
#
#   disco-vm build -f examples/windows.yaml -t discobox/windows:11 --build-arg ISO=D:\iso\Win11_25H2_English_x64.iso
#
# Microsoft does not allow an unattended ISO download, so the ISO is an input:
# https://www.microsoft.com/software-download/windows11
args:
  ISO: Win11_English_x64.iso
from:
  install:
    os: windows
    media: ${ISO}
    edition: Windows 11 Pro
    disk: 128GiB
resources:
  cpus: 4
  memory: 8GiB
layers:
  - name: system
    steps:
      - name: developer settings
        run: |
          Set-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled -Value 1
          New-Item -Force HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock | Out-Null
          Set-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock -Name AllowDevelopmentWithoutDevLicense -Value 1
          powercfg /change standby-timeout-ac 0
          powercfg /change monitor-timeout-ac 0
      - name: OpenSSH server
        run: |
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          Set-Service sshd -StartupType Automatic
