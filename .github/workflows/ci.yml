# Every job body is one Taskfile target; what it does lives in Taskfile.yml
# and runs the same way in a terminal.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/task
        with:
          target: verify

  check:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/task
        with:
          target: check

  test:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/task
        with:
          target: test

  # The Linux guest image (pkg/guest/linux) assembles and verifies itself
  # inside its build, made here as a linux/v* tag's release makes it
  # (linux-guest.yml), without the push: both architectures on Depot, each
  # natively. The depot CLI signs in with the job's OIDC token, or, for a
  # pull request from a fork, Depot's exchange for public repositories.
  linux-guest:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
        with:
          version: 2.103.5
      - uses: ./.github/actions/task
        with:
          target: build:linux-guest:depot

  # The agent, as a push to main publishes it (agent.yml), pushed to a
  # registry on the runner and pulled back by its digest.
  agent:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/task
        with:
          target: test:agent

  # The linux and windows release binaries, as a tag's release builds them
  # (release.yml).
  release:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/task
        env:
          RELEASE_TAG: v0.0.0-alpha.0
        with:
          target: release:build

  # The libkrun driver booted (ADR 26-11-03-530 §9): its runtime and the
  # guest image's libkrun kernel built and verified from the checkout, then
  # machinetest and internal/e2e on them. GitHub's own Linux runners expose
  # /dev/kvm; the first step lets the runner's user open it.
  libkrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/task
        with:
          target: ci:kvm
      - uses: ./.github/actions/task
        with:
          target: test:libkrun

  # disco-vm ships on macOS, and vz is cgo: darwin is linted and tested only
  # here.
  macos:
    runs-on: depot-macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/task
        with:
          target: check:go
      - uses: ./.github/actions/task
        with:
          target: test
      # The darwin release binary, signed and checked for its entitlement as
      # a tag's release builds it (release.yml).
      - uses: ./.github/actions/task
        env:
          RELEASE_TAG: v0.0.0-alpha.0
        with:
          target: release:build

  # Nix does not run on Windows: this job gets Go from setup-go and nothing
  # else (repostd ci.no-setup). It builds cold: setup-go's cache is
  # actions/cache, and Depot Cache fails on Windows (repostd
  # ci.no-actions-cache).
  windows:
    runs-on: depot-windows-2025-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go tool task test
